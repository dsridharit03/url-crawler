version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql://crawler_db_zdd3_user:iF0txIHnkPbvGhvlfsAqQJvYxUQVtREq@dpg-d22rk4m3jp1c7397noj0-a/crawler_db_zdd3
